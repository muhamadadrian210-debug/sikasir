<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0369a1" />
    <title>Dashboard — SiKasir</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  </head>
  <body>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <img src="/icons/logo.svg" alt="" width="36" height="36" />
          <strong>SiKasir</strong>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <div id="sidebar-mode-label" class="sidebar-mode-hint"></div>
          <div id="user-badge"></div>
          <button type="button" class="btn btn-secondary btn-block mt-1" id="btn-change-mode">
            Ganti mode
          </button>
          <button type="button" class="btn btn-secondary btn-block mt-1" id="btn-logout">
            Keluar
          </button>
        </div>
      </aside>
      <div class="main-wrap">
        <header class="topbar">
          <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
          <h2 id="page-title">Kasir (POS)</h2>
        </header>
        <main class="content">
          <div id="global-alert"></div>

          <section id="view-pos" class="view panel"></section>
          <section id="view-scan" class="view panel hidden"></section>
          <section id="view-products" class="view panel hidden"></section>
          <section id="view-reports" class="view panel hidden"></section>
          <section id="view-stock" class="view panel hidden"></section>
          <section id="view-users" class="view panel hidden"></section>
          <section id="view-incoming" class="view panel hidden"></section>
          <section id="view-audit" class="view panel hidden"></section>
          <section id="view-history" class="view panel hidden"></section>
        </main>
        <footer class="app-footer-watermark">Product by Sivilize Corp</footer>
      </div>
    </div>

    <div class="modal-backdrop" id="modal-scan">
      <div class="modal">
        <h3>Scan barcode</h3>
        <div id="scan-video-host" class="scan-video-wrap"></div>
        <p class="mt-1" style="font-size: 0.9rem">Arahkan kamera ke barcode. Izinkan akses kamera jika diminta.</p>
        <div class="actions-inline mt-1">
          <button type="button" class="btn btn-secondary" id="modal-scan-close">Tutup</button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
