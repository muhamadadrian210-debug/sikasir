<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0369a1" />
    <title>Masuk — SiKasir</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-brand">
          <img src="/icons/logo.svg" alt="" width="48" height="48" />
          <div>
            <h1>SiKasir</h1>
            <p style="margin: 0; color: var(--text); font-size: 0.9rem">
              Kasir supermarket &amp; stok
            </p>
          </div>
        </div>
        <div id="login-alert" class="alert alert-error hidden"></div>
        <a class="btn-apk-download btn-block" href="/downloads/sikasir-debug.apk" download>
          📱 Download Aplikasi Android (.APK)
        </a>
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab active" id="tab-login" data-panel="login" aria-selected="true">
            Masuk
          </button>
          <button type="button" class="auth-tab" id="tab-register" data-panel="register" aria-selected="false">
            Daftar Toko
          </button>
        </div>

        <form id="login-form" class="auth-panel" data-panel="login">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="btn-pw-toggle" data-pw-target="password">
                Tampilkan
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Masuk</button>
        </form>

        <form id="register-form" class="auth-panel hidden" data-panel="register">
          <p class="auth-hint">Daftarkan kios/toko baru dan buat akun admin Anda.</p>
          <div class="field">
            <label for="reg-store-name">Nama Toko / Kios</label>
            <input id="reg-store-name" name="store_name" required placeholder="Contoh: Kios Abizar" />
          </div>
          <div class="field">
            <label for="reg-store-type">Jenis Toko / Kios</label>
            <select id="reg-store-type" name="store_type" required>
              <option value="">— Pilih jenis toko —</option>
              <option value="Minimarket">Minimarket</option>
              <option value="Warung Sembako">Warung Sembako</option>
              <option value="Toko Kelontong">Toko Kelontong</option>
              <option value="Apotek / Toko Obat">Apotek / Toko Obat</option>
              <option value="Toko Elektronik">Toko Elektronik</option>
              <option value="Toko Pakaian / Fashion">Toko Pakaian / Fashion</option>
              <option value="Toko Alat Tulis / ATK">Toko Alat Tulis / ATK</option>
              <option value="Toko Bangunan / Material">Toko Bangunan / Material</option>
              <option value="Toko Kosmetik / Kecantikan">Toko Kosmetik / Kecantikan</option>
              <option value="Toko Makanan & Minuman">Toko Makanan & Minuman</option>
              <option value="Toko Peralatan Rumah Tangga">Toko Peralatan Rumah Tangga</option>
              <option value="Toko Otomotif / Spare Part">Toko Otomotif / Spare Part</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div class="field">
            <label for="reg-username">Username Admin</label>
            <input id="reg-username" name="username" required placeholder="Contoh: admin" />
          </div>
          <div class="field">
            <label for="reg-password">Password</label>
            <div class="password-field">
              <input id="reg-password" name="password" type="password" required placeholder="Minimal 8 karakter" />
              <button type="button" class="btn-pw-toggle" data-pw-target="reg-password">
                Tampilkan
              </button>
            </div>
          </div>
          <div class="field">
            <label for="reg-password-confirm">Ulangi Password</label>
            <div class="password-field">
              <input id="reg-password-confirm" name="password_confirm" type="password" required placeholder="Ulangi password" />
              <button type="button" class="btn-pw-toggle" data-pw-target="reg-password-confirm">
                Tampilkan
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Daftar &amp; Masuk</button>
        </form>
      </div>
    </div>
    <footer class="app-footer-watermark">Copyright © 2026 Muhamad Adrian. All rights reserved. Owned and Published by Sivilize Corp.</footer>
    <script src="/js/samsung-redirect.js"></script>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
