<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient: Obsidian Navy Depth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Shield Border Gradient: Emerald to Cyan (Trust & Security) -->
    <linearGradient id="shieldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Growth Arrow & Emerald Flow (Finansial & Keuntungan) -->
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Cyan Laser Scan Beam Gradient (Kecepatan & Akurasi Barcode) -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Center Verified Spark Gradient -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. FILOSOFI PERISAI (SHIELD): Keamanan & Perlindungan Transaksi Bisnis -->
  <path d="M 256 28 
           C 370 28, 448 68, 448 152 
           C 448 296, 360 416, 256 484 
           C 152 416, 64 296, 64 152 
           C 64 68, 142 28, 256 28 Z" 
        fill="url(#bgGradient)" 
        stroke="url(#shieldBorderGrad)" 
        stroke-width="10" 
        stroke-linejoin="round" />

  <!-- Inner Ambient Protection Glow -->
  <path d="M 256 46 
           C 352 46, 428 82, 428 156 
           C 428 282, 348 392, 256 456 
           C 164 392, 84 282, 84 156 
           C 84 82, 160 46, 256 46 Z" 
        fill="#10B981" 
        fill-opacity="0.04" />

  <!-- 2. FILOSOFI LASER SCAN & TRANSAKSI CEPAT (Top Left Arch to Center) -->
  <path d="M 170 178 C 170 140, 205 118, 256 118 C 308 118, 342 142, 342 178 C 342 208, 318 226, 276 238 L 236 250" 
        stroke="url(#scanGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        fill="none" />

  <!-- 3. FILOSOFI PERTUMBUHAN OMSET & FINANSIAL NAIK (Bottom S Curve with Arrow Tip ↗) -->
  <path d="M 236 250 L 276 262 C 322 276, 346 298, 346 334 C 346 376, 308 402, 256 402 C 200 402, 166 374, 164 332" 
        stroke="url(#growthGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Dynamic Financial Growth Arrow Head ↗ (Puncak Kesuksesan Bisnis) -->
  <path d="M 326 126 L 372 126 L 372 172" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  <line x1="288" y1="210" x2="368" y2="130" 
        stroke="#38BDF8" 
        stroke-width="20" 
        stroke-linecap="round" />

  <!-- 4. FILOSOFI TRANSAKSI TERVERIFIKASI & CASHLESS CORE (Simbol Integritas & Koin Sukses) -->
  <circle cx="256" cy="256" r="38" fill="#090D16" stroke="url(#growthGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="24" fill="url(#sparkGlow)" />
  <circle cx="256" cy="256" r="12" fill="#34D399" />

  <!-- Barcode Speed Accent Marks -->
  <rect x="180" y="278" width="6" height="24" rx="3" fill="#10B981" opacity="0.8" />
  <rect x="194" y="284" width="4" height="18" rx="2" fill="#34D399" opacity="0.9" />
  <rect x="204" y="280" width="8" height="22" rx="4" fill="#38BDF8" opacity="0.8" />
</svg>
