<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Friendly Fresh Emerald -->
    <linearGradient id="cashierBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Receipt Soft Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.3" />
    </filter>

    <!-- Coin Gold Gradient -->
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle App Icon -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#cashierBg)" />

  <!-- Inner Soft Highlight Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8" />

  <!-- The Receipt Popping Out of Cash Register -->
  <g filter="url(#softShadow)">
    <path d="M 196 90 
             L 316 90 
             Q 326 90 326 100 
             L 326 210 
             L 186 210 
             L 186 100 
             Q 186 90 196 90 Z" 
          fill="#FFFFFF" />
    
    <!-- Receipt Zig-zag Top Edge -->
    <path d="M 186 96 
             L 200 84 L 214 96 L 228 84 L 242 96 L 256 84 L 270 96 L 284 84 L 298 96 L 312 84 L 326 96
             L 326 90 L 186 90 Z" 
          fill="#FFFFFF" />

    <!-- Receipt Printed Text Lines -->
    <rect x="210" y="118" width="92" height="10" rx="5" fill="#10B981" />
    <rect x="210" y="138" width="68" height="8" rx="4" fill="#94A3B8" />
    <rect x="210" y="154" width="80" height="8" rx="4" fill="#94A3B8" />
    <rect x="210" y="170" width="50" height="8" rx="4" fill="#CBD5E1" />
  </g>

  <!-- Modern Friendly Cash Register Body -->
  <g filter="url(#softShadow)">
    <!-- Register Main Body -->
    <rect x="110" y="194" width="292" height="174" rx="28" fill="#FFFFFF" />

    <!-- Register Display Screen -->
    <rect x="138" y="222" width="138" height="52" rx="14" fill="#F1F5F9" />
    <!-- Screen Value Green Pill -->
    <rect x="150" y="238" width="76" height="18" rx="9" fill="#10B981" />
    <circle cx="254" cy="247" r="7" fill="#34D399" />

    <!-- Register Keypad Buttons (Clean & Minimalist) -->
    <!-- Row 1 -->
    <circle cx="316" cy="235" r="11" fill="#E2E8F0" />
    <circle cx="348" cy="235" r="11" fill="#E2E8F0" />
    <circle cx="376" cy="235" r="11" fill="#F59E0B" />
    <!-- Row 2 -->
    <circle cx="316" cy="263" r="11" fill="#E2E8F0" />
    <circle cx="348" cy="263" r="11" fill="#E2E8F0" />
    <circle cx="376" cy="263" r="11" fill="#10B981" />

    <!-- Cash Drawer (Laci Kasir) Base -->
    <path d="M 86 368 
             L 426 368 
             Q 440 368 440 382 
             L 440 404 
             Q 440 418 426 418 
             L 86 418 
             Q 72 418 72 404 
             L 72 382 
             Q 72 368 86 368 Z" 
          fill="#FFFFFF" />

    <!-- Cash Drawer Slot / Handle -->
    <rect x="216" y="386" width="80" height="12" rx="6" fill="#059669" />
    <!-- Keyhole / Security Dot -->
    <circle cx="388" cy="392" r="5" fill="#CBD5E1" />
  </g>

  <!-- Warm Floating Golden Coin Accent (Keberuntungan & Rezeki Toko) -->
  <g transform="translate(372, 134)">
    <circle cx="0" cy="0" r="38" fill="url(#goldCoin)" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FDE68A" stroke-width="4" stroke-opacity="0.8" />
    <!-- Rupiah / Currency Center Symbol -->
    <text x="0" y="11" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">Rp</text>
  </g>

  <!-- Friendly Star Sparkle -->
  <path d="M 112 144 Q 112 160 96 160 Q 112 160 112 176 Q 112 160 128 160 Q 112 160 112 144 Z" fill="#FDE68A" opacity="0.9" />
</svg>
