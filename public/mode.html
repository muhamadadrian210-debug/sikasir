  <body>
    <div class="login-page">
      <div class="login-card" style="max-width: 500px">
        <div class="login-brand">
          <img src="/icons/logo.svg" alt="SiKasir Logo" width="44" height="44" />
          <div>
            <h1 style="margin-bottom: 0.2rem">Pilih Mode Kerja</h1>
            <p style="margin: 0; color: var(--text-muted); font-size: 0.86rem">
              Sesuaikan alur tampilan aplikasi dengan tugas Anda saat ini
            </p>
          </div>
        </div>
        <p id="mode-user-hint" style="margin: 0 0 1.25rem; font-size: 0.88rem; font-weight: 700; color: var(--primary);"></p>
        <div class="mode-grid" id="mode-grid"></div>

        <div style="margin-top: 1.25rem; padding-top: 0.75rem; border-top: 1px solid var(--border); text-align: center;">
          <button type="button" class="btn btn-secondary btn-block pwa-install-trigger" id="btn-install-pwa" data-pwa-install style="display: none; padding: 0.6rem; font-size: 0.85rem; color: #059669; border-color: rgba(5, 150, 105, 0.4); font-weight: 700; align-items: center; justify-content: center; gap: 8px;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Pasang SiKasir di Layar Utama (APK Standalone)
          </button>
        </div>
      </div>
    </div>
    <footer class="app-footer-watermark">Copyright © 2026 Muhamad Adrian. All rights reserved. Owned and Published by Sivilize Corp.</footer>
    <script src="/js/samsung-redirect.js"></script>
    <script src="/js/pwa-install.js" defer></script>
    <script type="module" src="/js/mode.js"></script>
