<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0369a1" />
    <title>Pilih mode — SiKasir</title>
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"

        <p id="mode-user-hint" style="margin: 0 0 1rem; font-size: 0.9rem; color: var(--secondary)"></p>
        <div class="mode-grid" id="mode-grid"></div>
      </div>
    </div>
    <footer class="app-footer-watermark">Copyright © 2026 Muhamad Adrian. All rights reserved. Owned and Published by Sivilize Corp.</footer>
    <script type="module" src="/js/mode.js"></script>
